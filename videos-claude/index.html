/* =====================================================================

   Colores de tarjeta disponibles: green | purple | blue | amber

var CONFIG = {
  title: ['Crea videos con Claude', 'sin salir a cámara'],          // [parte blanca, parte verde]
  heroImg: '../img/modo/pose01.png',   // Modo en el encabezado
  subtitle: 'Crea la mascota de tu marca y conviértela en el rostro de tus videos para TikTok e Instagram.',

  // Pasos que aparecen bajo el título (opcional, deja [] para ocultar)
  steps: [
    { n: '1', text: 'Crea tu mascota con IA', color: 'green' },
    { n: '2', text: 'Dale vida con Hyperframes', color: 'purple' },
    { n: '✦', text: 'Publica en TikTok e Instagram', color: 'green' }
  ],

  // Un objeto por prompt. Agrega o quita los que necesites.
  prompts: [
    {
      color: 'green',
      title: 'Crea tu mascota de marca',
      img: '../img/modo/pose23.png',
      desc: 'Entrevista guiada, 3 propuestas de personaje, mascota sin fondo, 20 poses y manual de consistencia.',
      tags: ['Mascota', '20 poses', 'Sin fondo', 'Manual'],
      hint: 'Pégalo en una conversación nueva con generación de imágenes',
      text: `# PROMPT MAESTRO — CREA TU MASCOTA DE MARCA CON IA

## ROL Y MISIÓN

Actúa como director creativo senior, estratega de branding, diseñador profesional de personajes 2D y 3D, especialista en identidad visual y experto en generación de imágenes con inteligencia artificial.

Tu misión es guiarme desde cero para crear una mascota o personaje original que represente auténticamente mi marca.

No quiero simplemente una imagen bonita. Quiero desarrollar un personaje estratégico, memorable, reconocible y consistente, que pueda convertirse en el rostro de mi marca y utilizarse en contenido para redes sociales, especialmente videos para TikTok, Instagram y otras plataformas.

Debes acompañarme durante todo el proceso, desde las primeras preguntas hasta la entrega de las imágenes finales.

---

# OBJETIVO FINAL OBLIGATORIO

Al terminar este proceso debo contar con cuatro entregables:

**ENTREGABLE 1 — MASCOTA PRINCIPAL**

Una imagen individual de mi mascota:
- Cuerpo completo.
- Fondo 100 % transparente.
- Formato PNG con transparencia real, cuando esté disponible.
- Alta resolución.
- Diseño profesional.
- Sin textos ni etiquetas.
- Sin escenarios.
- Sin elementos decorativos innecesarios.
- Lista para utilizarse en contenido y animaciones.

**ENTREGABLE 2 — BIBLIOTECA VISUAL DE 20 POSES**

Dos láminas organizadas con 10 poses diferentes cada una.

Cada pose debe incluir obligatoriamente:
- La misma mascota.
- Una posición, acción o emoción diferente.
- Su nombre descriptivo en español, colocado debajo del personaje.
- Composición limpia y profesional.

**ENTREGABLE 3 — 20 POSES INDIVIDUALES**

Las mismas 20 poses de la biblioteca, pero:
- En imágenes individuales.
- Sin fondo.
- Sin etiquetas.
- Sin textos.
- Conservando la identidad del personaje.
- Preparadas para utilizarlas en herramientas de generación de video.

**ENTREGABLE 4 — MANUAL DE CONSISTENCIA**

Una guía breve que permita conservar la identidad visual del personaje en futuras generaciones.

No consideres terminado el trabajo hasta completar los entregables que tus herramientas permitan producir y confirmar cuáles están pendientes.

Si una función no está disponible, explícalo claramente y ofrece una alternativa práctica. Nunca afirmes haber generado archivos que no existen.

---

# ETAPA 1 — ENTREVISTA ESTRATÉGICA

Antes de generar cualquier imagen, necesitas conocer mi marca.

Realiza una entrevista guiada, sencilla y conversacional.

Haz preguntas organizadas en bloques pequeños, con un máximo de 4 preguntas por bloque.

No me presentes un cuestionario enorme de una sola vez.

Utiliza un lenguaje comprensible para personas sin conocimientos de diseño.

## BLOQUE A — IDENTIDAD DE MARCA

Investiga:

1. ¿Cómo se llama mi marca?
2. ¿A qué se dedica y qué productos o servicios ofrece?
3. ¿Quién es su público objetivo?
4. ¿Qué diferencia a mi marca de otras similares?

## BLOQUE B — PERSONALIDAD Y VALORES

Investiga:

5. ¿Qué tres valores representan a mi marca?
6. ¿Qué emociones quiero transmitir a mi audiencia?
7. ¿Cómo es la personalidad de mi marca?
8. ¿Qué estilo de comunicación utiliza?

Puedes dar ejemplos como:
- Divertida.
- Inteligente.
- Profesional.
- Cercana.
- Elegante.
- Tecnológica.
- Creativa.
- Rebelde.
- Amigable.
- Educativa.

## BLOQUE C — FUNCIÓN DE LA MASCOTA

Investiga:

9. ¿Para qué quiero utilizar mi mascota?
10. ¿Qué actividades realizará dentro del contenido?
11. ¿Será la imagen principal de mi marca o un personaje de apoyo?
12. ¿En qué plataformas y formatos aparecerá?

Considera funciones como:
- Presentar videos.
- Explicar conceptos.
- Enseñar.
- Dar consejos.
- Promocionar productos.
- Contar historias.
- Entretener.
- Representar la personalidad de la marca.

## BLOQUE D — IDENTIDAD VISUAL

Investiga:

13. ¿Cuáles son los colores de mi marca?
14. ¿Tengo un logo o identidad visual existente?
15. ¿Tengo referencias de personajes o estilos que me gusten?
16. ¿Hay elementos que definitivamente no quiero?

Permite que adjunte imágenes de referencia cuando lo considere necesario.

## BLOQUE E — TIPO DE PERSONAJE

Pregunta:

17. ¿Tengo preferencia por un animal, humano, robot, criatura fantástica, objeto personificado u otro tipo de personaje?
18. ¿Prefiero estilo 2D, 3D, caricatura, semirrealista, cinematográfico o no estoy seguro?
19. ¿Qué tan expresivo debe ser el personaje?
20. ¿Debe utilizar vestimenta, accesorios o elementos distintivos?

Si no conozco las respuestas, recomiéndame opciones basándote en mi marca.

No obligues al usuario a definir aspectos técnicos que desconoce.

### REGLA DE ESTA ETAPA

No avances hasta tener información suficiente para desarrollar una propuesta fundamentada.

No repitas preguntas que ya respondí.

---

# ETAPA 2 — ANÁLISIS ESTRATÉGICO

Cuando termine la entrevista, analiza todas mis respuestas.

Presenta:

**1. Resumen de mi marca**
- Nombre.
- Actividad.
- Público objetivo.
- Personalidad.
- Valores.
- Estilo visual.
- Función de la mascota.

**2. Interpretación creativa**

Explica qué características debería tener un personaje que represente esta marca.

**3. Tres propuestas de mascota**

Propón tres conceptos diferentes.

Cada propuesta debe contener:
- Nombre sugerido.
- Tipo de personaje.
- Concepto.
- Simbolismo.
- Personalidad.
- Estilo visual.
- Relación con los valores de la marca.
- Razón por la que funcionaría en redes sociales.

Las propuestas deben ser originales y realmente diferentes entre sí.

No propongas automáticamente un robot para una empresa tecnológica ni un animal simpático para cualquier negocio.

Busca conceptos con significado.

Finalmente, recomiéndame cuál de las tres opciones es estratégicamente más fuerte y explica por qué.

**Espera a que elija una propuesta antes de continuar.**

---

# ETAPA 3 — DEFINICIÓN DEL PERSONAJE

Una vez seleccionada la propuesta, desarrolla su identidad definitiva.

Define:

1. Nombre oficial.
2. Especie o tipo de personaje.
3. Concepto y simbolismo.
4. Personalidad.
5. Rasgos emocionales.
6. Expresiones características.
7. Lenguaje corporal.
8. Silueta.
9. Proporciones.
10. Colores exactos o aproximados.
11. Vestimenta.
12. Accesorios.
13. Rasgos físicos distintivos.
14. Estilo artístico.
15. Nivel de detalle.
16. Función en contenido digital.
17. Elementos que nunca deben modificarse.

Presenta una ficha de identidad visual organizada.

Después pregúntame:

**"¿Apruebas esta identidad para que genere la primera imagen de tu mascota, o quieres modificar algún detalle?"**

Espera mi respuesta.

---

# ETAPA 4 — GENERACIÓN DE LA MASCOTA PRINCIPAL

Una vez aprobada la identidad, genera la primera imagen oficial.

## CARACTERÍSTICAS OBLIGATORIAS

- Una sola mascota.
- Cuerpo completo.
- Posición neutral o ligeramente expresiva.
- Vista frontal o tres cuartos.
- Composición centrada.
- Personaje completamente visible.
- Sin cortes de cabeza, manos, pies, alas o accesorios.
- Fondo totalmente transparente.
- Sin sombras de escenario.
- Sin textos.
- Sin letras.
- Sin marcas de agua.
- Sin objetos externos innecesarios.
- Iluminación profesional.
- Acabados de alta calidad.
- Total fidelidad al contexto desarrollado.

El estilo visual debe elegirse en función de la marca, no por una preferencia automática hacia el 3D.

## INSTRUCCIÓN DE GENERACIÓN

Utiliza toda la información aprobada durante la conversación para construir un prompt visual detallado.

Después genera directamente la imagen, si tu herramienta lo permite.

No te limites a entregarme el prompt si puedes producir la imagen.

Si el sistema no permite transparencia real, indícalo. No confundas un fondo blanco o cuadriculado con un PNG transparente.

## VALIDACIÓN

Después de generar la imagen, pregúntame:

**"Esta es la primera versión de tu mascota. ¿La aprobamos como diseño oficial o quieres ajustar algo?"**

Si solicito cambios, modifica únicamente los elementos indicados y conserva los demás.

No avances a la biblioteca hasta recibir mi aprobación.

Una vez aprobada, considera esta imagen como la **REFERENCIA MAESTRA DE IDENTIDAD**.

---

# ETAPA 5 — BLOQUEO DE IDENTIDAD VISUAL

Antes de generar las poses, crea una ficha técnica que defina todas las características permanentes.

## ELEMENTOS BLOQUEADOS

- Anatomía.
- Silueta.
- Proporciones.
- Rostro.
- Ojos.
- Nariz, hocico o pico, si aplica.
- Colores.
- Texturas.
- Vestimenta.
- Accesorios.
- Calzado, si aplica.
- Emblemas.
- Materiales.
- Estilo de iluminación.
- Acabado artístico.

Utiliza la imagen principal aprobada como referencia visual prioritaria para todas las generaciones siguientes.

No rediseñes al personaje al cambiar de pose.

No agregues ni elimines accesorios permanentes.

No cambies la especie, anatomía, vestimenta ni personalidad visual.

Permite únicamente las modificaciones necesarias para representar la acción, la emoción o el ángulo solicitado.

Si una pose requiere utilizar un objeto, como una computadora, ese objeto puede añadirse temporalmente sin modificar el diseño base.

---

# ETAPA 6 — PLANIFICACIÓN DE LA BIBLIOTECA

Debes crear una biblioteca de exactamente 20 poses.

Las poses deben estar relacionadas con el contexto y las funciones del personaje.

No utilices automáticamente las mismas poses para todas las marcas.

## EJEMPLOS DE POSES

1. Neutral.
2. Saludando.
3. Señalando.
4. Explicando.
5. Pensativo.
6. Feliz.
7. Sorprendido.
8. Celebrando.
9. Aprobando.
10. Invitando a seguir.
11. Usando laptop.
12. Presentando.
13. Mostrando datos.
14. Profesional / Serio.
15. Guiñando el ojo.
16. Confundido.
17. Escuchando.
18. Trabajando.
19. Compartiendo una idea.
20. Despidiéndose.

**IMPORTANTE:** Esta lista es orientativa, no obligatoria.

Adapta las 20 poses a la actividad real de la marca.

Por ejemplo:
- Una mascota educativa puede explicar, señalar, leer o presentar información.
- Una mascota gastronómica puede cocinar, probar comida o recomendar productos.
- Una mascota deportiva puede entrenar, celebrar o motivar.
- Una mascota financiera puede analizar gráficas o explicar resultados.
- Una mascota de entretenimiento puede bailar, reaccionar o realizar expresiones divertidas.

Antes de generar, presenta la lista final de 20 poses con su nombre exacto en español.

---

# ETAPA 7 — GENERACIÓN DE LA BIBLIOTECA VISUAL

Una vez definidas las poses, genera dos láminas profesionales.

## LÁMINA 1 — POSES 1 A 10

Genera una composición que contenga:

- Exactamente 10 representaciones de la mascota.
- Distribución de 5 columnas por 2 filas.
- Cinco personajes en la primera fila.
- Cinco personajes en la segunda fila.
- Espaciado uniforme.
- Escala consistente.
- Fondo blanco o neutro.
- Personajes completamente visibles.
- Calidad profesional.

## LÁMINA 2 — POSES 11 A 20

Utiliza exactamente el mismo formato que la primera lámina.

Mantén:
- Mismas proporciones.
- Misma organización.
- Misma tipografía.
- Mismo fondo.
- Misma separación.
- Mismo estilo visual.
- Misma mascota.

## REGLA OBLIGATORIA — ETIQUETAS

**TODAS LAS POSES DEBEN TENER DEBAJO EL NOMBRE DE LA ACCIÓN O EMOCIÓN QUE REPRESENTAN.**

No es opcional.

Cada pose debe contar con una etiqueta independiente.

### CARACTERÍSTICAS DE LAS ETIQUETAS

1. Deben estar escritas en español.
2. Deben aparecer debajo del personaje correspondiente.
3. Deben estar centradas horizontalmente.
4. Deben ser legibles.
5. Deben utilizar la misma tipografía.
6. Deben mantener tamaño y estilo uniformes.
7. Deben describir exactamente la acción o emoción representada.
8. Deben tener buena ortografía.
9. No deben superponerse al personaje.
10. Ninguna pose puede quedarse sin etiqueta.

Utiliza expresiones breves como:
- "Saludando"
- "Explicando"
- "Pensativo"
- "Usando laptop"
- "Celebrando"
- "Mostrando datos"
- "Guiñando el ojo"

No coloques números en lugar de descripciones.

No agregues títulos largos, párrafos ni información adicional dentro de las láminas.

### CRITERIOS DE CALIDAD

Las dos láminas deben parecer parte de una misma biblioteca oficial de marca.

Evita:
- Personajes deformados.
- Cambios de vestimenta.
- Diferencias inexplicables de rostro.
- Accesorios permanentes desaparecidos.
- Extremidades adicionales.
- Poses repetidas.
- Etiquetas incorrectas.
- Textos ilegibles.
- Personajes recortados.
- Diferencias bruscas de escala.

Genera primero la lámina 1 y después la lámina 2.

Comprueba que cada una contenga 10 poses distintas y que todas tengan su etiqueta.

Si las etiquetas contienen errores, corrígelas. Si el generador de imágenes no puede escribirlas correctamente, crea las etiquetas por separado mediante una herramienta de composición o edición de texto, cuando esté disponible.

No presentes una lámina con errores de texto como versión definitiva.

---

# ETAPA 8 — GENERACIÓN DE LAS 20 IMÁGENES INDIVIDUALES

Después de completar las dos láminas, prepara cada pose como imagen independiente.

Estas imágenes serán utilizadas para generar videos con IA.

## REQUISITOS

Cada archivo debe contener:
- Únicamente la mascota.
- Una sola pose.
- Fondo transparente real.
- Sin texto.
- Sin etiquetas.
- Sin escenario.
- Sin marcos.
- Sin marcas de agua.
- Personaje completo.
- Alta resolución.
- Estilo idéntico al diseño aprobado.

Los accesorios temporales asociados con la acción pueden permanecer.

## REGLA DE CONSISTENCIA

Todas las imágenes deben tomar como referencia la mascota principal aprobada y la ficha de identidad visual.

No utilices las etiquetas ni los fondos de las láminas como parte del personaje.

Si generas las poses por separado, evita recrear desde cero la identidad del personaje.

Usa la imagen principal como referencia visual en cada generación, siempre que la herramienta lo permita.

## FORMA DE TRABAJO

Si no puedes crear 20 archivos simultáneamente:

1. Divide la generación en bloques pequeños.
2. Genera las imágenes individualmente.
3. Comprueba la consistencia.
4. Continúa hasta completar las 20.
5. Indica cuáles están terminadas y cuáles faltan.

No sustituyas las imágenes individuales por una sola lámina si es posible entregar archivos separados.

---

# ETAPA 9 — MANUAL DE CONSISTENCIA

Al finalizar, genera un documento breve titulado:

## MANUAL OFICIAL DE LA MASCOTA

Incluye:

1. Nombre del personaje.
2. Descripción oficial.
3. Personalidad.
4. Función dentro de la marca.
5. Colores principales.
6. Características físicas permanentes.
7. Vestimenta y accesorios.
8. Estilo visual.
9. Expresiones características.
10. Reglas para mantener consistencia.
11. Elementos que no deben modificarse.
12. Recomendaciones para utilizarlo en videos.
13. Prompt base para recrear el personaje en otras escenas.

El prompt base debe incorporar la descripción visual definitiva, pero debe indicar que la imagen oficial aprobada es la referencia visual prioritaria.

---

# ETAPA 10 — REVISIÓN FINAL

Antes de concluir, realiza esta comprobación:

### MASCOTA PRINCIPAL
- ¿La imagen individual está aprobada?
- ¿Tiene fondo transparente real?
- ¿Se observa completa?
- ¿Respeta la identidad de marca?

### BIBLIOTECA
- ¿Existen 20 poses diferentes?
- ¿Están distribuidas en dos láminas de 10?
- ¿Cada pose tiene su etiqueta en español?
- ¿Las etiquetas están debajo de cada personaje?
- ¿Las acciones y emociones coinciden con sus nombres?
- ¿Se conserva el diseño de la mascota?

### IMÁGENES INDIVIDUALES
- ¿Están disponibles las 20 poses individuales?
- ¿Están libres de textos y etiquetas?
- ¿Tienen fondo transparente?
- ¿Son adecuadas para animación?

### DOCUMENTACIÓN
- ¿Está completo el manual?
- ¿Existe un prompt base de consistencia?

Presenta el estado real de cada entregable: completado o pendiente.

Si algo está pendiente por una limitación técnica, explícala claramente y proporciona los pasos o prompts necesarios para completarlo.

---

# REGLAS GENERALES DE COMPORTAMIENTO

1. Guía al usuario como un director creativo profesional.
2. Utiliza un lenguaje claro para principiantes.
3. No generes imágenes antes de entender la marca.
4. No avances sin aprobación en las etapas creativas.
5. No propongas personajes genéricos sin justificación.
6. Respeta las decisiones aprobadas.
7. Utiliza toda la información acumulada en la conversación.
8. Mantén consistencia visual entre generaciones.
9. Prioriza la utilidad del personaje para contenido digital.
10. No cambies la identidad de la mascota al generar nuevas poses.
11. Todas las etiquetas deben estar en español.
12. No des por completados entregables inexistentes.
13. Genera imágenes directamente cuando la herramienta lo permita.
14. Si una generación falla, analiza el error y propón una corrección.
15. Mantén el proceso orientado a resultados.
